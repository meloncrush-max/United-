<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - Sign In / Sign Up</title>
    <meta name="theme-color" content="#2d6a4f">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --primary-light: #52b788;
            --accent: #95d5b2;
            --text: #ffffff;
            --bg: #081c15;
            --gold: #ffd60a;
            --error: #d62828;
            --success: #52b788;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary-dark) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: rgba(27, 67, 50, 0.9);
            border: 1px solid rgba(82, 183, 136, 0.3);
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 56px;
            margin-bottom: 20px;
        }

        .title {
            text-align: center;
            color: var(--gold);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--accent);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--gold);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--accent);
            color: var(--text);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 214, 10, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .password-strength {
            font-size: 12px;
            color: var(--accent);
            margin-top: 6px;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .strength-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .strength-fill {
            height: 100%;
            width: 33%;
            transition: all 0.3s ease;
        }

        .strength-fill.weak {
            background: var(--error);
            width: 33%;
        }

        .strength-fill.medium {
            background: #ffa500;
            width: 66%;
        }

        .strength-fill.strong {
            background: var(--success);
            width: 100%;
        }

        .error-message {
            background: rgba(214, 40, 40, 0.2);
            border: 1px solid var(--error);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(82, 183, 136, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-light);
            color: var(--primary-dark);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            background: #5cc896;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--gold);
            padding: 12px;
            font-size: 14px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .forgot-password {
            text-align: right;
            margin-top: 10px;
        }

        .forgot-password a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        small {
            display: block;
            margin-top: 4px;
        }

        @media (max-width: 500px) {
            .auth-container {
                padding: 30px 20px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🌍</div>
        <h1 class="title">Connected</h1>
        <p class="subtitle">Collaborate, Create, Connect</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
            <div class="error-message" id="loginError"></div>
            <div class="success-message" id="loginSuccess"></div>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPasswordModal(event)">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="btn" id="loginBtn">Sign In</button>
                <div class="loading" id="loginLoading">Signing in...</div>
            </form>
        </div>

        <!-- SIGNUP TAB -->
        <div id="signup" class="tab-content">
            <div class="error-message" id="signupError"></div>
            <div class="success-message" id="signupSuccess"></div>
            
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required onchange="checkPasswordStrength()" autocomplete="new-password">
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <small id="strengthText"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupConfirm">Confirm Password</label>
                    <input type="password" id="signupConfirm" placeholder="••••••••" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn" id="signupBtn">Create Account</button>
                <div class="loading" id="signupLoading">Creating account...</div>
            </form>

            <p style="font-size: 12px; color: var(--accent); text-align: center; margin-top: 20px;">
                By signing up, you agree to our Terms & Privacy Policy
            </p>
        </div>
    </div>

    <script>
        // ✅ FIXED: No hardcoded API keys - use backend proxy only
        const API_URL = 'http://localhost:3001'; // Change to your production backend URL

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        // Password strength checker
        function checkPasswordStrength() {
            const password = document.getElementById('signupPassword').value;
            const strength = document.getElementById('passwordStrength');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            if (!password) {
                strength.classList.remove('show');
                return;
            }

            strength.classList.add('show');

            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            fill.className = 'strength-fill';
            if (score < 2) {
                fill.classList.add('weak');
                text.textContent = '❌ Weak - Add uppercase, numbers, symbols';
            } else if (score < 4) {
                fill.classList.add('medium');
                text.textContent = '⚠️ Medium - Add more variety';
            } else {
                fill.classList.add('strong');
                text.textContent = '✅ Strong - Good password!';
            }
        }

        // Show error
        function showError(tab, message) {
            const errorEl = document.getElementById(`${tab}Error`);
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        // Show success
        function showSuccess(tab, message) {
            const successEl = document.getElementById(`${tab}Success`);
            successEl.textContent = message;
            successEl.classList.add('show');
            setTimeout(() => successEl.classList.remove('show'), 5000);
        }

        // ✅ FIXED: Login via backend API (no direct Supabase calls)
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const loading = document.getElementById('loginLoading');

            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/auth/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Send cookies
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // ✅ FIXED: Store token securely (backend sends httpOnly cookie now)
                localStorage.setItem('accessToken', data.accessToken);
                
                // Redirect to app
                setTimeout(() => {
                    window.location.href = './loading.html';
                }, 500);
            } catch (err) {
                showError('login', err.message || 'Login failed. Check your credentials.');
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        // ✅ FIXED: Signup via backend API
        async function handleSignup(event) {
            event.preventDefault();

            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const btn = document.getElementById('signupBtn');
            const loading = document.getElementById('signupLoading');

            if (password !== confirm) {
                showError('signup', 'Passwords do not match');
                return;
            }

            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                // ✅ FIXED: Store token securely
                localStorage.setItem('accessToken', data.accessToken);
                
                showSuccess('signup', 'Account created! Check your email. Redirecting...');
                
                setTimeout(() => {
                    window.location.href = './loading.html';
                }, 2000);
            } catch (err) {
                showError('signup', err.message || 'Unable to create account');
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        // ✅ NEW: Forgot password handler
        function showForgotPasswordModal(event) {
            event.preventDefault();
            
            const email = prompt('Enter your email address:');
            if (!email) return;

            fetch(`${API_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message || 'Check your email for password reset link');
            })
            .catch(err => {
                alert('Error sending reset email. Please try again.');
            });
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('accessToken');
            if (token) {
                // User is already logged in, redirect to app
                window.location.href = './loading.html';
            }
        });
    </script>
</body>
</html>
