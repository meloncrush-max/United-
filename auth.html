<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - Sign In / Sign Up</title>
    <meta name="theme-color" content="#2d6a4f">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --primary-light: #52b788;
            --accent: #95d5b2;
            --text: #ffffff;
            --bg: #081c15;
            --gold: #ffd60a;
            --error: #d62828;
            --success: #52b788;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary-dark) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .auth-container {
            width: 100%; max-width: 420px; background: rgba(27, 67, 50, 0.9);
            border: 1px solid rgba(82, 183, 136, 0.3); padding: 50px; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .logo { text-align: center; font-size: 56px; margin-bottom: 20px; }
        .title { text-align: center; color: var(--gold); font-size: 28px; margin-bottom: 10px; }
        .subtitle { text-align: center; color: var(--accent); font-size: 14px; margin-bottom: 30px; }
        .demo-message {
            background: rgba(82, 183, 136, 0.2); border: 1px solid var(--accent);
            padding: 12px; border-radius: 6px; margin-bottom: 20px;
            font-size: 13px; color: var(--accent); text-align: center;
        }
        .tabs { display: flex; gap: 0; margin-bottom: 30px; background: rgba(0,0,0,0.2); border-radius: 6px; padding: 4px; }
        .tab-btn { flex:1; padding:12px; background:transparent; border:none; color:var(--accent); cursor:pointer; font-size:16px; font-weight:600; border-radius:4px; }
        .tab-btn.active { background: var(--primary); color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display:block; color:var(--accent); margin-bottom:8px; font-weight:600; font-size:14px; }
        input[type="email"], input[type="password"], input[type="text"] {
            width:100%; padding:12px; background:rgba(0,0,0,0.3); border:1px solid var(--accent); color:var(--text); border-radius:6px; font-size:14px;
        }
        input:focus { outline:none; border-color: var(--gold); background: rgba(0,0,0,0.5); }
        input::placeholder { color: rgba(255,255,255,0.5); }
        .password-strength { font-size: 12px; color: var(--accent); margin-top:6px; display:none; }
        .password-strength.show { display:block; }
        .strength-bar { width:100%; height:4px; background: rgba(0,0,0,0.3); border-radius:2px; overflow:hidden; margin-bottom:6px; }
        .strength-fill { height:100%; width:33%; transition: all 0.3s ease; }
        .strength-fill.weak { background: var(--error); width:33%; }
        .strength-fill.medium { background: #ffa500; width:66%; }
        .strength-fill.strong { background: var(--success); width:100%; }
        .error-message, .success-message {
            padding:12px; border-radius:6px; margin-bottom:20px; display:none; font-size:14px;
        }
        .error-message { background: rgba(214, 40, 40, 0.2); border:1px solid var(--error); color:#ff6b6b; }
        .success-message { background: rgba(82, 183, 136, 0.2); border:1px solid var(--success); color:var(--success); }
        .error-message.show, .success-message.show { display:block; }
        .btn {
            width:100%; padding:12px; background: var(--primary-light); color: var(--primary-dark);
            border:none; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer; margin-top:20px;
        }
        .btn:hover { background:#5cc896; transform: translateY(-2px); }
        .loading { display:none; text-align:center; color: var(--gold); padding:12px; font-size:14px; }
        @media (max-width:500px) { .auth-container { padding:30px 20px; } .title { font-size:24px; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🌍</div>
        <h1 class="title">Connected</h1>
        <p class="subtitle">Collaborate, Create, Connect</p>

        <div class="demo-message">📢 Demo Mode: Use any email and password to continue</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="login" class="tab-content active">
            <div class="error-message" id="loginError"></div>
            <div class="success-message" id="loginSuccess"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Sign In</button>
                <div class="loading" id="loginLoading">Signing in...</div>
            </form>
        </div>

        <div id="signup" class="tab-content">
            <div class="error-message" id="signupError"></div>
            <div class="success-message" id="signupSuccess"></div>
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required onchange="checkPasswordStrength()">
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <small id="strengthText"></small>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupConfirm">Confirm Password</label>
                    <input type="password" id="signupConfirm" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="signupBtn">Create Account</button>
                <div class="loading" id="signupLoading">Creating account...</div>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function checkPasswordStrength() {
            const password = document.getElementById('signupPassword').value;
            const strength = document.getElementById('passwordStrength');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            if (!password) { strength.classList.remove('show'); return; }
            strength.classList.add('show');
            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            fill.className = 'strength-fill';
            if (score < 2) {
                fill.classList.add('weak');
                text.textContent = '❌ Weak - Add uppercase, numbers, symbols';
            } else if (score < 4) {
                fill.classList.add('medium');
                text.textContent = '⚠️ Medium - Add more variety';
            } else {
                fill.classList.add('strong');
                text.textContent = '✅ Strong - Good password!';
            }
        }

        function showError(tab, message) {
            const errorEl = document.getElementById(`${tab}Error`);
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 5000);
        }

        function showSuccess(tab, message) {
            const successEl = document.getElementById(`${tab}Success`);
            successEl.textContent = message;
            successEl.classList.add('show');
            setTimeout(() => successEl.classList.remove('show'), 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const loading = document.getElementById('loginLoading');
            btn.style.display = 'none';
            loading.style.display = 'block';
            try {
                await new Promise(resolve => setTimeout(resolve, 1000));
                localStorage.setItem('userName', email.split('@')[0]);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('sessionToken', 'demo-user');
                showSuccess('login', 'Login successful! Redirecting...');
                setTimeout(() => window.location.href = './app.html', 800);
            } catch (err) {
                showError('login', 'Login failed');
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            const btn = document.getElementById('signupBtn');
            const loading = document.getElementById('signupLoading');
            if (password !== confirm) {
                showError('signup', 'Passwords do not match');
                return;
            }
            btn.style.display = 'none';
            loading.style.display = 'block';
            try {
                await new Promise(resolve => setTimeout(resolve, 1000));
                localStorage.setItem('userName', name || email.split('@')[0]);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('sessionToken', 'demo-user');
                showSuccess('signup', 'Account created! Redirecting...');
                setTimeout(() => window.location.href = './app.html', 1000);
            } catch (err) {
                showError('signup', 'Unable to create account');
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem('sessionToken')) {
                window.location.href = './app.html';
            }
        });
    </script>
</body>
</html>
