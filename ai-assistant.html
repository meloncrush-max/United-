<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - AI Assistant</title>
    <meta name="theme-color" content="#2d6a4f">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --primary-light: #52b788;
            --accent: #95d5b2;
            --text: #ffffff;
            --bg: #081c15;
            --gold: #ffd60a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary-dark) 100%);
            color: var(--text); min-height: 100vh; padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom:20px; border-bottom:2px solid rgba(82,183,136,0.2); }
        .header h1 { color: var(--gold); font-size: 32px; }
        .back-link { color: var(--accent); text-decoration:none; padding:10px 20px; background: rgba(45,106,79,0.5); border-radius:6px; }
        .chat-container {
            background: rgba(27, 67, 50, 0.5); border: 1px solid rgba(82,183,136,0.2);
            border-radius:12px; display:flex; flex-direction:column; height:600px;
        }
        .chat-header {
            padding:20px; border-bottom:1px solid rgba(82,183,136,0.2); display:flex; justify-content:space-between; align-items:center;
        }
        .chat-title { color: var(--gold); font-size:20px; }
        .language-select {
            padding:8px 12px; background: rgba(0,0,0,0.3); border:1px solid var(--accent); color:var(--text); border-radius:6px;
        }
        .chat-messages {
            flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px;
        }
        .message { display:flex; gap:10px; }
        .message.user { justify-content:flex-end; }
        .message-content { max-width:70%; padding:12px 15px; border-radius:8px; line-height:1.5; font-size:14px; }
        .message.ai .message-content { background: rgba(45,106,79,0.5); border:1px solid rgba(82,183,136,0.2); color: var(--accent); }
        .message.user .message-content { background: var(--primary-light); color: var(--primary-dark); font-weight:500; }
        .message-time { font-size:12px; color:rgba(255,255,255,0.5); align-self:flex-end; margin-top:4px; }
        .chat-input-area { padding:20px; border-top:1px solid rgba(82,183,136,0.2); display:flex; gap:10px; }
        .input-row { display:flex; gap:10px; width:100%; }
        #aiInput {
            flex:1; padding:12px; background: rgba(0,0,0,0.3); border:1px solid var(--accent); color:var(--text); border-radius:6px; font-size:14px;
        }
        .send-btn {
            padding:12px 20px; background: var(--gold); color: var(--primary-dark); border:none; border-radius:6px; cursor:pointer; font-weight:600;
        }
        .emotion-detector {
            background: rgba(45, 106, 79, 0.3); padding:12px; border-radius:6px; margin-top:8px; font-size:12px; color:var(--accent); display:none;
        }
        .emotion-detector.show { display:block; }
        .emotion-badge { display:inline-block; background: rgba(82,183,136,0.3); padding:4px 8px; border-radius:4px; margin-right:8px; font-weight:600; }
        @media (max-width:768px) { .chat-container { height:500px; } .message-content { max-width:85%; } .header { flex-direction:column; gap:15px; align-items:flex-start; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💚 Mukelo AI Assistant</h1>
            <a href="app.html" class="back-link">← Back to App</a>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-title">Let's talk! 💬</div>
                <select class="language-select" id="languageSelect" onchange="changeLanguage()">
                    <option value="en">🇬🇧 English</option>
                    <option value="ss">🇸🇿 Siswati</option>
                    <option value="zu">🇿🇦 Zulu</option>
                    <option value="xh">🇿🇦 Xhosa</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="ar">🇸🇦 Arabic</option>
                </select>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div>
                        <div class="message-content">👋 Hi! I'm Mukelo AI, your prototype assistant. How can I help you today?</div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper" style="flex:1; display:flex; flex-direction:column; gap:8px;">
                    <div class="input-row">
                        <input type="text" id="aiInput" placeholder="Type your question or message..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button class="send-btn" onclick="sendMessage()" id="sendBtn">Send</button>
                    </div>
                    <div class="emotion-detector" id="emotionDetector"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLanguage = 'en';
        const storageKey = 'connected_ai_history';

        function changeLanguage() {
            currentLanguage = document.getElementById('languageSelect').value;
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
            const messagesDiv = document.getElementById('chatMessages');
            if (!history.length) return;
            messagesDiv.innerHTML = '';
            history.forEach(msg => {
                const messageEl = document.createElement('div');
                messageEl.className = `message ${msg.role}`;
                messageEl.innerHTML = `
                    <div>
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-time">${msg.time || 'Just now'}</div>
                    </div>
                `;
                messagesDiv.appendChild(messageEl);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function saveHistory(messages) {
            localStorage.setItem(storageKey, JSON.stringify(messages));
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            messageEl.innerHTML = `
                <div>
                    <div class="message-content">${escapeHtml(content)}</div>
                    <div class="message-time">Just now</div>
                </div>
            `;
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
            history.push({ role, content, time: 'Just now' });
            if (history.length > 20) history.shift();
            saveHistory(history);
        }

        function detectEmotion(text) {
            const msg = text.toLowerCase();
            if (msg.includes('sad') || msg.includes('down') || msg.includes('depressed')) return { emotion: 'sad', intent: 'support' };
            if (msg.includes('angry') || msg.includes('mad') || msg.includes('frustrated')) return { emotion: 'angry', intent: 'problem-solving' };
            if (msg.includes('happy') || msg.includes('great') || msg.includes('excited')) return { emotion: 'happy', intent: 'celebration' };
            if (msg.includes('anxious') || msg.includes('worried') || msg.includes('stress')) return { emotion: 'anxious', intent: 'comfort' };
            if (msg.includes('confused') || msg.includes('lost')) return { emotion: 'confused', intent: 'clarification' };
            return { emotion: 'neutral', intent: 'general help' };
        }

        function showEmotionDetection(emotion, intent) {
            const detector = document.getElementById('emotionDetector');
            const emoticons = { happy: '😊', sad: '😢', angry: '😠', anxious: '😰', confused: '😕', neutral: '😐' };
            detector.innerHTML = `<span class="emotion-badge">${emoticons[emotion] || '😐'} ${emotion}</span> Intent: ${intent}`;
            detector.classList.add('show');
        }

        function generateAIResponse(message) {
            const msg = message.toLowerCase();
            if (msg.includes('study') || msg.includes('learn')) return '📚 Great! I can help you find study partners or suggest a plan. What subject are you studying?';
            if (msg.includes('code') || msg.includes('program')) return '💻 Awesome! I can help you find a coding partner or suggest next steps. What language are you working in?';
            if (msg.includes('help') || msg.includes('how')) return '🆘 I can help with peer matching, planning, and support. What do you need?';
            if (msg.includes('peer') || msg.includes('partner')) return '👥 I can match you with a supportive peer. Tell me your activity, language, and skill level.';
            if (msg.includes('sad') || msg.includes('depressed') || msg.includes('down')) return '💙 I am sorry you are feeling down. A supportive conversation can help. Would you like to speak with a peer?';
            if (msg.includes('happy') || msg.includes('great') || msg.includes('awesome')) return '🎉 That is amazing! Keep that positive energy going. What are you excited about?';
            if (msg.includes('thanks') || msg.includes('thank you')) return '😊 You are welcome! Happy to help. What else can I do for you?';
            return '👂 That sounds interesting! Tell me more, and I will help you with the next step.';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendMessage() {
            const input = document.getElementById('aiInput');
            const message = input.value.trim();
            if (!message) return;
            addMessage('user', message);
            input.value = '';

            const { emotion, intent } = detectEmotion(message);
            showEmotionDetection(emotion, intent);

            setTimeout(() => {
                const response = generateAIResponse(message);
                addMessage('ai', response);
            }, 600);
        }

        loadHistory();
    </script>
</body>
</html>
