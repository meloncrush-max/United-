<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - Loading</title>
    <meta name="theme-color" content="#2d6a4f">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #2d6a4f; --primary-dark: #1b4332; --primary-light: #52b788; --accent: #95d5b2; --text:#ffffff; --bg:#081c15; --gold:#ffd60a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary-dark) 100%);
            color: var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .loading-container { max-width:500px; width:100%; display:flex; flex-direction:column; align-items:center; gap:30px; }
        .splash-image { width:100%; max-width:400px; border-radius:16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .heading { text-align:center; font-size:32px; font-weight:700; color:var(--gold); margin:0; }
        .subheading { text-align:center; font-size:18px; color:var(--accent); }
        .loading-spinner { width:50px; height:50px; border:4px solid rgba(82,183,136,0.3); border-top:4px solid var(--gold); border-radius:50%; animation:spin 1s linear infinite; }
        .loading-text { text-align:center; font-size:14px; color:var(--accent); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (max-width:600px) { .heading { font-size:28px; } .subheading { font-size:16px; } }
    </style>
</head>
<body>
    <div class="loading-container">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80" alt="Connected Community" class="splash-image">
        <h1 class="heading">🙂 We're here for you</h1>
        <p class="subheading">Connecting African innovators worldwide</p>
        <div class="loading-spinner"></div>
        <p class="loading-text">Getting everything ready...</p>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = './app.html';
        }, 2500);
    </script>
</body>
</html>
