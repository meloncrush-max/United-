<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected - Contacts & Marketplace</title>
    <meta name="theme-color" content="#2d6a4f">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --primary-light: #52b788;
            --accent: #95d5b2;
            --text: #ffffff;
            --bg: #081c15;
            --gold: #ffd60a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary-dark) 100%);
            color: var(--text); min-height:100vh; padding:20px;
        }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; padding-bottom:20px; border-bottom:2px solid rgba(82,183,136,0.2); }
        .header h1 { color: var(--gold); font-size:32px; }
        .back-link { color: var(--accent); text-decoration:none; padding:10px 20px; background: rgba(45,106,79,0.5); border-radius:6px; }
        .tabs { display:flex; gap:10px; margin-bottom:30px; border-bottom:1px solid rgba(82,183,136,0.2); }
        .tab-btn { padding:12px 20px; background:none; border:none; color:var(--accent); cursor:pointer; font-size:16px; border-bottom:3px solid transparent; }
        .tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:20px; margin-bottom:30px; }
        .card { background: rgba(27,67,50,0.5); border:1px solid rgba(82,183,136,0.2); padding:20px; border-radius:8px; }
        .card h3 { color: var(--gold); margin-bottom:10px; }
        .card p { color: var(--accent); font-size:14px; margin-bottom:15px; }
        .card-actions { display:flex; gap:10px; }
        .btn { flex:1; padding:8px; background: var(--primary); color: var(--text); border:1px solid var(--accent); border-radius:6px; cursor:pointer; }
        .btn-danger { background:#d62828; border-color:#ff6b6b; }
        .btn-primary { background: var(--gold); color: var(--primary-dark); padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
        .empty { text-align:center; padding:60px 20px; color:var(--accent); }
        .modal { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; }
        .modal.show { display:flex; }
        .modal-content { background: rgba(27,67,50,0.95); padding:40px; border-radius:12px; border:1px solid rgba(82,183,136,0.3); max-width:400px; width:90%; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; color: var(--accent); margin-bottom:6px; }
        .form-group input, .form-group textarea { width:100%; padding:10px; background: rgba(0,0,0,0.3); border:1px solid var(--accent); color:var(--text); border-radius:6px; }
        .modal-actions { display:flex; gap:10px; margin-top:20px; }
        .modal-actions button { flex:1; padding:10px; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
        .btn-submit { background: var(--gold); color: var(--primary-dark); }
        .btn-cancel { background: rgba(82,183,136,0.2); color: var(--accent); border:1px solid var(--accent); }
        @media (max-width:768px) { .header { flex-direction:column; gap:20px; } .grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Contacts & Marketplace</h1>
            <a href="app.html" class="back-link">← Back to App</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('contacts')">My Contacts</button>
            <button class="tab-btn" onclick="switchTab('plans')">Plans</button>
        </div>

        <div id="contacts" class="tab-content active">
            <div style="margin-bottom:20px;"><button class="btn-primary" onclick="openAddContactModal()">+ Add Contact</button></div>
            <div class="grid" id="contactsGrid"></div>
        </div>

        <div id="plans" class="tab-content">
            <div style="margin-bottom:20px;"><button class="btn-primary" onclick="openAddPlanModal()">+ Create New Plan</button></div>
            <div class="grid" id="plansGrid"></div>
        </div>
    </div>

    <div class="modal" id="addContactModal">
        <div class="modal-content">
            <h2 style="color:var(--gold); margin-bottom:20px;">Add Contact</h2>
            <form onsubmit="handleAddContact(event)">
                <div class="form-group"><label>Name</label><input type="text" id="contactName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="contactEmail" required></div>
                <div class="form-group"><label>Notes</label><textarea id="contactNotes" rows="3" placeholder="Add notes..."></textarea></div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('addContactModal')">Cancel</button>
                    <button type="submit" class="btn-submit">Add Contact</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="addPlanModal">
        <div class="modal-content">
            <h2 style="color:var(--gold); margin-bottom:20px;">Create Plan</h2>
            <form onsubmit="handleAddPlan(event)">
                <div class="form-group"><label>Title</label><input type="text" id="planTitle" required></div>
                <div class="form-group"><label>Description</label><textarea id="planDescription" rows="3" placeholder="What is this plan about?"></textarea></div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('addPlanModal')">Cancel</button>
                    <button type="submit" class="btn-submit">Create Plan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CONTACTS_KEY = 'connected_contacts';
        const PLANS_KEY = 'connected_plans';

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function getContacts() {
            return JSON.parse(localStorage.getItem(CONTACTS_KEY) || '[]');
        }

        function getPlans() {
            return JSON.parse(localStorage.getItem(PLANS_KEY) || '[]');
        }

        function saveContacts(contacts) {
            localStorage.setItem(CONTACTS_KEY, JSON.stringify(contacts));
        }

        function savePlans(plans) {
            localStorage.setItem(PLANS_KEY, JSON.stringify(plans));
        }

        function renderContacts() {
            const grid = document.getElementById('contactsGrid');
            const contacts = getContacts();
            if (!contacts.length) {
                grid.innerHTML = '<div class="empty"><p>📞 No contacts yet. Add some to stay connected!</p><button class="btn-primary" onclick="openAddContactModal()">Add Your First Contact</button></div>';
                return;
            }
            grid.innerHTML = contacts.map((c, index) => `
                <div class="card">
                    <h3>${c.name}</h3>
                    <p>${c.email}</p>
                    <p>${c.notes || 'No notes'}</p>
                    <div class="card-actions">
                        <button class="btn" onclick="alert('Demo: Messaging coming soon!')">💬 Message</button>
                        <button class="btn btn-danger" onclick="deleteContact(${index})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function renderPlans() {
            const grid = document.getElementById('plansGrid');
            const plans = getPlans();
            if (!plans.length) {
                grid.innerHTML = '<div class="empty"><p>📝 No plans yet. Create one to organize your projects!</p><button class="btn-primary" onclick="openAddPlanModal()">Create Your First Plan</button></div>';
                return;
            }
            grid.innerHTML = plans.map((p, index) => `
                <div class="card">
                    <h3>${p.title}</h3>
                    <p>${p.description || 'No description'}</p>
                    <p style="font-size:12px; color:#52b788;">Status: active</p>
                    <div class="card-actions">
                        <button class="btn" onclick="alert('Demo: plan details coming soon!')">📋 View</button>
                        <button class="btn btn-danger" onclick="deletePlan(${index})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openAddContactModal() { document.getElementById('addContactModal').classList.add('show'); }
        function openAddPlanModal() { document.getElementById('addPlanModal').classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        function handleAddContact(e) {
            e.preventDefault();
            const contacts = getContacts();
            contacts.push({
                name: document.getElementById('contactName').value,
                email: document.getElementById('contactEmail').value,
                notes: document.getElementById('contactNotes').value
            });
            saveContacts(contacts);
            renderContacts();
            closeModal('addContactModal');
            e.target.reset();
        }

        function handleAddPlan(e) {
            e.preventDefault();
            const plans = getPlans();
            plans.push({
                title: document.getElementById('planTitle').value,
                description: document.getElementById('planDescription').value
            });
            savePlans(plans);
            renderPlans();
            closeModal('addPlanModal');
            e.target.reset();
        }

        function deleteContact(index) {
            if (!confirm('Delete this contact?')) return;
            const contacts = getContacts();
            contacts.splice(index, 1);
            saveContacts(contacts);
            renderContacts();
        }

        function deletePlan(index) {
            if (!confirm('Delete this plan?')) return;
            const plans = getPlans();
            plans.splice(index, 1);
            savePlans(plans);
            renderPlans();
        }

        renderContacts();
        renderPlans();
    </script>
</body>
</html>
